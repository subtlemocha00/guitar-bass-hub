# Android — Capacitor APK
#
# Produces a debug APK from the Capacitor Android project so mobile builds are
# reproducible in CI. Flow mirrors the local one:
#   build:capacitor (Vite) -> cap sync android -> gradle assembleDebug.
#
# A DEBUG APK is built on purpose: it is signed with the standard Android debug
# keystore, so no signing secrets are required. A release/Play-signed APK/AAB
# would need an upload keystore + credentials (see docs / the limitations note in
# the PR) and is intentionally out of scope here.
name: Android — Capacitor APK

on:
  workflow_dispatch: {} # manual trigger from the Actions tab
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest # GitHub's Ubuntu image ships the Android SDK
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21" # Capacitor 8 / AGP require JDK 17+; matches local
          cache: gradle # caches ~/.gradle (dependencies + wrapper)

      - name: Install dependencies
        run: npm ci

      - name: Write .env from secrets
        run: |
          cat > .env <<'EOF'
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          EOF

      # Native Google sign-in needs android/app/google-services.json, which is
      # gitignored. Restore it from a base64 secret when present; the gradle build
      # applies the google-services plugin only if the file exists (see
      # android/app/build.gradle), so the APK still builds without it — native
      # Google sign-in just won't be configured.
      - name: Restore google-services.json (optional)
        if: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 != '' }}
        run: echo "${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json

      - name: Build web assets (Capacitor target)
        run: npm run build:capacitor

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
