# Guitar + Bass // Hub — Android APK
#
# Produces a debug APK from the Capacitor Android project so mobile builds are
# reproducible in CI. Flow mirrors the local one:
#   build:capacitor (Vite) -> cap sync android -> gradle assembleDebug.
#
# A DEBUG APK is built on purpose: it is signed with the standard Android debug
# keystore, so no signing secrets are required. A release/Play-signed APK/AAB
# would need an upload keystore + credentials and is intentionally out of scope
# here — see "Known limitations" in docs/release.md.
name: Guitar + Bass // Hub — Android APK

on:
  workflow_dispatch: {} # manual trigger from the Actions tab
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest # GitHub's Ubuntu image ships the Android SDK
    timeout-minutes: 30

    # Job-level env, not step-level, because a step's `if:` is evaluated before
    # that step's own `env:` exists. The optional-restore step below needs to
    # read this value from the `env` context, so it has to be declared here.
    env:
      ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21" # Capacitor 8 / AGP require JDK 17+; matches local
          cache: gradle # caches ~/.gradle (dependencies + wrapper)

      - name: Install dependencies
        run: npm ci

      # Native Google sign-in needs android/app/google-services.json, which is
      # gitignored, so CI restores it from a base64 secret.
      #
      # This is REQUIRED, not optional. Without it the google-services plugin
      # never generates the google_app_id resource, FirebaseApp fails to
      # initialise at startup, and Capacitor silently drops the
      # FirebaseAuthentication plugin — producing a green build whose APK reports
      # '"FirebaseAuthentication" plugin is not implemented on android' at
      # runtime. See the long comment in android/app/build.gradle.
      #
      # The value is read from the environment inside the script rather than
      # interpolated into it, so no secret text is ever parsed as shell. The
      # decoded file is validated here so a truncated or wrong-project secret
      # fails immediately with a clear message instead of five minutes later
      # inside Gradle.
      - name: Restore google-services.json
        run: |
          if [ -z "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::Repository secret ANDROID_GOOGLE_SERVICES_JSON_BASE64 is not set. Native Google sign-in cannot be built without it. Generate with: base64 -w0 android/app/google-services.json"
            exit 1
          fi
          printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          node -e '
            const cfg = require("./android/app/google-services.json");
            const want = "com.guitarbasshub.app";
            const names = (cfg.client ?? []).map((c) => c.client_info?.android_client_info?.package_name);
            if (!names.includes(want)) {
              console.error(`::error::google-services.json has no client for ${want} (found: ${names.join(", ") || "none"}). Check the secret holds the Android app config for this Firebase project.`);
              process.exit(1);
            }
          '

      # Firebase config is supplied as environment variables rather than a .env
      # file — see the equivalent note in web.yml for why.
      - name: Build web assets (Capacitor target)
        run: npm run build:capacitor
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      # Copies dist-capacitor/ into the native project and refreshes plugins.
      # Must run after the web build and before gradle.
      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      # Assert the three things that have to be true for native Google sign-in,
      # checked against the APK itself rather than Gradle's intermediates (whose
      # paths move between AGP versions). Each failed independently in practice:
      # the first two passed while the third did not, which is what made the
      # runtime error point at the wrong thing.
      - name: Verify native plugins in APK
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          fail=0
          check() {
            if unzip -p "$apk" "$2" | grep -aq "$3"; then
              echo "ok:   $1"
            else
              echo "::error::$1 — not found in $apk"
              fail=1
            fi
          }
          check "FirebaseAuthentication listed in capacitor.plugins.json" assets/capacitor.plugins.json FirebaseAuthenticationPlugin
          check "FirebaseAuthenticationPlugin class compiled into the APK"  'classes*.dex'               FirebaseAuthenticationPlugin
          check "google_app_id resource present (FirebaseApp can initialise)" resources.arsc             google_app_id
          exit $fail

      # Gradle always emits app-debug.apk. Rename on the way out so the download
      # is self-describing instead of three identically-named files in a folder.
      - name: Stage APK
        run: |
          mkdir -p artifact
          cp android/app/build/outputs/apk/debug/app-debug.apk artifact/Guitar-and-Bass-Hub.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Guitar-and-Bass-Hub-APK
          path: artifact/Guitar-and-Bass-Hub.apk
          if-no-files-found: error
          retention-days: 30
