# Guitar + Bass // Hub — Android APK
#
# Produces a debug APK from the Capacitor Android project so mobile builds are
# reproducible in CI. Flow mirrors the local one:
#   build:capacitor (Vite) -> cap sync android -> gradle assembleDebug.
#
# A DEBUG APK is built on purpose: it is signed with the standard Android debug
# keystore, so no signing secrets are required. A release/Play-signed APK/AAB
# would need an upload keystore + credentials and is intentionally out of scope
# here — see "Known limitations" in docs/release.md.
name: Guitar + Bass // Hub — Android APK

on:
  workflow_dispatch: {} # manual trigger from the Actions tab
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest # GitHub's Ubuntu image ships the Android SDK
    timeout-minutes: 30

    # Job-level env, not step-level, because a step's `if:` is evaluated before
    # that step's own `env:` exists. The optional-restore step below needs to
    # read this value from the `env` context, so it has to be declared here.
    env:
      ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
      ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21" # Capacitor 8 / AGP require JDK 17+; matches local
          cache: gradle # caches ~/.gradle (dependencies + wrapper)

      - name: Install dependencies
        run: npm ci

      # Native Google sign-in needs android/app/google-services.json, which is
      # gitignored, so CI restores it from a base64 secret.
      #
      # This is REQUIRED, not optional. Without it the google-services plugin
      # never generates the google_app_id resource, FirebaseApp fails to
      # initialise at startup, and Capacitor silently drops the
      # FirebaseAuthentication plugin — producing a green build whose APK reports
      # '"FirebaseAuthentication" plugin is not implemented on android' at
      # runtime. See the long comment in android/app/build.gradle.
      #
      # The value is read from the environment inside the script rather than
      # interpolated into it, so no secret text is ever parsed as shell. The
      # decoded file is validated here so a truncated or wrong-project secret
      # fails immediately with a clear message instead of five minutes later
      # inside Gradle.
      - name: Restore google-services.json
        run: |
          if [ -z "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::Repository secret ANDROID_GOOGLE_SERVICES_JSON_BASE64 is not set. Native Google sign-in cannot be built without it. Generate with: base64 -w0 android/app/google-services.json"
            exit 1
          fi
          printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          node -e '
            const cfg = require("./android/app/google-services.json");
            const want = "com.guitarbasshub.app";
            const names = (cfg.client ?? []).map((c) => c.client_info?.android_client_info?.package_name);
            if (!names.includes(want)) {
              console.error(`::error::google-services.json has no client for ${want} (found: ${names.join(", ") || "none"}). Check the secret holds the Android app config for this Firebase project.`);
              process.exit(1);
            }
          '

      # Google sign-in authorises an app by (package name + signing certificate
      # SHA-1), so the certificate that signs the APK has to be one registered in
      # Firebase. AGP signs debug builds with ~/.android/debug.keystore and
      # GENERATES a random one if that file is absent — which it is on a fresh
      # runner, and runners are ephemeral. A CI APK would therefore carry a
      # different, unregistered SHA-1 on every single run, and Google Identity
      # Services refuses to issue a credential for it:
      #
      #     androidx.credentials.exceptions.NoCredentialException:
      #     No credentials available
      #
      # Restoring the same debug keystore used locally makes the CI APK's SHA-1
      # match the one already registered. This needs no Gradle change: AGP's
      # default debug signing config reads exactly this path.
      #
      # This is a DEBUG keystore with the well-known password "android" — it is
      # not a release credential. Release signing remains out of scope.
      - name: Restore debug keystore
        run: |
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret ANDROID_DEBUG_KEYSTORE_BASE64 is not set. Without it AGP generates a random debug keystore whose SHA-1 is not registered in Firebase, and Google sign-in fails with NoCredentialException. Generate with: base64 -w0 ~/.android/debug.keystore"
            exit 1
          fi
          mkdir -p ~/.android
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -alias androiddebugkey \
            -storepass android -keypass android > /dev/null
          echo "debug keystore restored"

      # Firebase config is supplied as environment variables rather than a .env
      # file — see the equivalent note in web.yml for why.
      - name: Build web assets (Capacitor target)
        run: npm run build:capacitor
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      # Copies dist-capacitor/ into the native project and refreshes plugins.
      # Must run after the web build and before gradle.
      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      # Assert what has to be true for native Google sign-in, checked against the
      # APK itself rather than Gradle's intermediates (whose paths move between
      # AGP versions — AGP 9 renamed the google-services output directory).
      #
      # The plugin checks and the Firebase-resource checks fail independently:
      # the first two passed while the config was missing, which is exactly what
      # made the runtime error ('plugin is not implemented on android') point at
      # plugin registration instead of at Firebase initialisation.
      #
      # Resource VALUES are decoded with aapt2 rather than grepping
      # resources.arsc for the resource name. A name-only grep proves a resource
      # exists, not that google-services.json was actually processed into a
      # usable value — an empty or wrong-project config would still pass it.
      - name: Verify Firebase init + native plugins in APK
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          aapt2=$(find "$sdk/build-tools" -maxdepth 2 -name aapt2 -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$aapt2" ]; then
            echo "::error::aapt2 not found under $sdk/build-tools; cannot verify the APK"
            exit 1
          fi
          res=$("$aapt2" dump resources "$apk")
          fail=0

          # A file/class must be present inside the APK.
          contains() {
            if unzip -p "$apk" "$2" | grep -aq "$3"; then
              echo "ok:   $1"
            else
              echo "::error::$1 — not found in $apk"
              fail=1
            fi
          }

          # A string resource must exist AND hold a well-formed value. These are
          # what FirebaseInitProvider reads at process start to build the default
          # FirebaseApp; without them FirebaseAuth.getInstance() throws inside
          # FirebaseAuthenticationPlugin.load() and Capacitor drops the plugin.
          # Values are never echoed — only whether they are well-formed.
          assert_res() {
            val=$(printf '%s\n' "$res" | grep -A1 -- "string/$1\$" | tail -1 | sed -n 's/.*() "\(.*\)"$/\1/p')
            if [ -n "$val" ] && printf '%s' "$val" | grep -Eq "$2"; then
              echo "ok:   string/$1 present and well-formed"
            else
              echo "::error::string/$1 is missing or malformed — google-services.json was not processed into Firebase resources, so FirebaseApp cannot initialise at startup and native Google sign-in will fail."
              fail=1
            fi
          }

          contains "FirebaseAuthentication listed in capacitor.plugins.json"  assets/capacitor.plugins.json FirebaseAuthenticationPlugin
          contains "FirebaseAuthenticationPlugin class compiled into the APK" 'classes*.dex'                FirebaseAuthenticationPlugin
          assert_res google_app_id        '^1:[0-9]+:android:[0-9a-f]+$'
          assert_res google_api_key       '^AIza[0-9A-Za-z_-]{10,}$'
          assert_res default_web_client_id '^[0-9]+-[0-9a-z]+\.apps\.googleusercontent\.com$'
          assert_res project_id           '^.+$'

          # Google authorises an app by (package name + signing certificate
          # SHA-1). Assert the certificate that actually signed this APK is one
          # registered in google-services.json — otherwise sign-in fails at
          # runtime with NoCredentialException even though every check above
          # passes. Compared against the config rather than a hardcoded value,
          # so re-registering a certificate needs no workflow edit.
          apksigner=$(find "$sdk/build-tools" -maxdepth 2 -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner not found under $sdk/build-tools; cannot verify the signing certificate"
            exit 1
          fi
          actual=$("$apksigner" verify --print-certs "$apk" | grep -m1 -i "SHA-1 digest" | tr -d ' ' | sed 's/.*://' | tr 'A-Z' 'a-z')
          expected=$(node -e '
            const c = require("./android/app/google-services.json");
            console.log(c.client
              .flatMap((cl) => cl.oauth_client ?? [])
              .filter((o) => o.client_type === 1)
              .map((o) => o.android_info?.certificate_hash?.toLowerCase())
              .filter(Boolean)
              .join(" "));
          ')
          if [ -z "$expected" ]; then
            echo "::error::google-services.json contains no Android OAuth client (client_type 1) with a certificate_hash, so Google sign-in cannot work. Add the signing certificate's SHA-1 in the Firebase console and re-download the config."
            fail=1
          elif printf '%s' " $expected " | grep -q " $actual "; then
            echo "ok:   APK signing certificate is registered for Google sign-in"
          else
            echo "::error::APK is signed with SHA-1 $actual, which is not registered in google-services.json (registered: $expected). Google sign-in will fail with NoCredentialException. Check ANDROID_DEBUG_KEYSTORE_BASE64 matches the keystore whose SHA-1 is in the Firebase console."
            fail=1
          fi
          exit $fail

      # Gradle always emits app-debug.apk. Rename on the way out so the download
      # is self-describing instead of three identically-named files in a folder.
      - name: Stage APK
        run: |
          mkdir -p artifact
          cp android/app/build/outputs/apk/debug/app-debug.apk artifact/Guitar-and-Bass-Hub.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Guitar-and-Bass-Hub-APK
          path: artifact/Guitar-and-Bass-Hub.apk
          if-no-files-found: error
          retention-days: 30
