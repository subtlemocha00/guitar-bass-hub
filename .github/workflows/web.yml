# Web / PWA — Build
#
# Builds the production Vite web/PWA bundle so it is reproducible in CI without
# running local commands. It BUILDS ONLY and uploads the bundle as an artifact —
# it deliberately does NOT deploy. Deployment stays exactly as before: manual,
# via `npm run deploy` (gh-pages) from a maintainer's machine. This preserves the
# existing deployment behavior while making the build reproducible.
name: Web / PWA — Build

on:
  workflow_dispatch: {} # manual trigger from the Actions tab
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read # build-only; no deploy, so no write scopes needed

jobs:
  build:
    name: Build web bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22" # satisfies Vite 8 (>= 22.12); matches local toolchain
          cache: npm # keyed on package-lock.json

      - name: Install dependencies
        run: npm ci

      # Firebase config is client-side (see .env.example) but .env is gitignored,
      # so CI provides the values from secrets. Empty secrets still build — auth
      # just won't be configured in the artifact.
      - name: Write .env from secrets
        run: |
          cat > .env <<'EOF'
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          EOF

      - name: Build web/PWA bundle
        run: npm run build:web

      - name: Upload web bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          if-no-files-found: error
