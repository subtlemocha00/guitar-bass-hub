# Windows — Tauri Installer
#
# Builds the Windows Tauri desktop app and its NSIS installer so desktop releases
# are reproducible in CI. `npm run tauri:build` runs the frontend build
# (beforeBuildCommand: build:native), compiles the Rust binary in release mode,
# and produces the NSIS installer — the installer is uploaded as an artifact.
#
# The installer is UNSIGNED (no Authenticode certificate). Windows SmartScreen
# will warn on first run. Code signing needs a certificate + credentials and is
# intentionally out of scope here (see the limitations note in the PR).
name: Windows — Tauri Installer

on:
  workflow_dispatch: {} # manual trigger from the Actions tab
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Tauri installer
    runs-on: windows-latest # MSVC toolchain + WebView2 runtime preinstalled
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Caches the cargo registry, git index and src-tauri/target build outputs,
      # keyed on src-tauri/Cargo.lock — the slowest part of a desktop build.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Write .env from secrets
        shell: bash
        run: |
          cat > .env <<'EOF'
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          EOF

      - name: Build Tauri app + NSIS installer
        run: npm run tauri:build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
