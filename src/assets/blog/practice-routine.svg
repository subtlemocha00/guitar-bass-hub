<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice">
	<defs>
		<linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
			<stop offset="0%" stop-color="#05021f"/>
			<stop offset="55%" stop-color="#0d0530"/>
			<stop offset="100%" stop-color="#1a0840"/>
		</linearGradient>
		<linearGradient id="glow" x1="0" x2="1">
			<stop offset="0%" stop-color="#05d9e8"/>
			<stop offset="100%" stop-color="#ff2a6d"/>
		</linearGradient>
		<filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
	</defs>
	<rect width="600" height="400" fill="url(#bg)"/>
	<g stroke="rgba(5,217,232,0.15)" stroke-width="1">
		<line x1="0" y1="80" x2="600" y2="80"/>
		<line x1="0" y1="160" x2="600" y2="160"/>
		<line x1="0" y1="240" x2="600" y2="240"/>
		<line x1="0" y1="320" x2="600" y2="320"/>
		<line x1="100" y1="0" x2="100" y2="400"/>
		<line x1="200" y1="0" x2="200" y2="400"/>
		<line x1="300" y1="0" x2="300" y2="400"/>
		<line x1="400" y1="0" x2="400" y2="400"/>
		<line x1="500" y1="0" x2="500" y2="400"/>
	</g>
	<circle cx="300" cy="200" r="120" fill="none" stroke="url(#glow)" stroke-width="2" filter="url(#blur)" opacity="0.7"/>
	<circle cx="300" cy="200" r="120" fill="none" stroke="#a3ff5e" stroke-width="2"/>
	<circle cx="300" cy="200" r="80" fill="none" stroke="#a3ff5e" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
	<line x1="300" y1="200" x2="300" y2="100" stroke="#ff2a6d" stroke-width="3" stroke-linecap="round"/>
	<line x1="300" y1="200" x2="370" y2="240" stroke="#05d9e8" stroke-width="3" stroke-linecap="round"/>
	<circle cx="300" cy="200" r="6" fill="#a3ff5e"/>
	<text x="300" y="365" text-anchor="middle" fill="rgba(214,246,255,0.75)" font-family="monospace" font-size="14" letter-spacing="6">// PRACTICE.LOOP</text>
</svg>
