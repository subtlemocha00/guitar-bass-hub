apply plugin: 'com.android.application'

// Version comes from the root package.json, the single source of truth already
// shared by Vite (VITE_APP_VERSION) and Tauri (tauri.conf.json reads
// "../package.json"). Android was the last target carrying a hand-maintained
// copy; deriving it here means `npm version` is the only place a release
// number is edited.
//
// versionCode has to be a monotonically increasing integer, which semver is
// not, so it is packed as MAJOR*10000 + MINOR*100 + PATCH. That rises with the
// version for any component below 100 and needs no separate counter. Any
// pre-release suffix is dropped for the code but kept in versionName, which is
// the human-readable string.
def packageJson = new groovy.json.JsonSlurper().parse(file('../../package.json'))
def appVersionName = packageJson.version
def semver = appVersionName.split('-')[0].tokenize('.').collect { it.toInteger() }
def appVersionCode = semver[0] * 10000 + semver[1] * 100 + semver[2]

android {
    namespace = "com.guitarbasshub.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.guitarbasshub.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// google-services.json is REQUIRED for this app, not optional.
//
// The google-services plugin turns it into the google_app_id / google_api_key
// string resources that Firebase's FirebaseInitProvider reads at process start
// to build the default FirebaseApp. Without those resources the build still
// succeeds and the APK still CONTAINS the FirebaseAuthentication plugin class
// and lists it in capacitor.plugins.json — but FirebaseAuth.getInstance()
// throws during the plugin's load(), Capacitor drops it from the registry, and
// the JS side reports:
//
//     "FirebaseAuthentication" plugin is not implemented on android
//
// which points at plugin registration and not at the actual cause. Capacitor's
// scaffolded version of this block wrapped the whole thing in a try/catch that
// downgraded a missing file to logger.info — invisible at the default log level,
// so CI shipped a green build with a broken sign-in. Fail here instead, at the
// point where the cause is still obvious.
def servicesJSON = file('google-services.json')
if (!servicesJSON.exists() || servicesJSON.length() == 0) {
    throw new GradleException(
        "android/app/google-services.json is missing or empty.\n" +
        "\n" +
        "It is gitignored, so every checkout needs its own copy:\n" +
        "  - locally: download it from the Firebase console\n" +
        "      (Project settings -> Your apps -> Android app -> google-services.json)\n" +
        "  - in CI:   set the ANDROID_GOOGLE_SERVICES_JSON_BASE64 repository secret\n" +
        "\n" +
        "See docs/mobile-auth.md and docs/release.md."
    )
}
apply plugin: 'com.google.gms.google-services'
